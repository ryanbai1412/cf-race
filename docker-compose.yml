# Local judge with the real isolate sandbox (same image as the Fly deployment).
#
#   make judge-docker          # rsyncs problems/dev -> judge/problems-dev, then builds & runs
#   curl localhost:8080/healthz
#
# Point the web app at it with JUDGE_URL=http://localhost:8080 JUDGE_TOKEN=dev
# in .env.local. The repo's problems/ dir is mounted read-write into the
# container, so everything under problems/ is available without a Supabase sync.
#
# For a no-Docker judge (unsafe plain-subprocess sandbox), use `make judge-dev`.
services:
  judge:
    build: ./judge # run `make judge-docker` (needs judge/problems-dev, see judge/README.md)
    privileged: true # isolate needs cgroup access
    ports:
      - "8080:8080"
    environment:
      JUDGE_TOKEN: ${JUDGE_TOKEN:-dev}
      PROBLEMS_DIR: /data/problems
    volumes:
      - ./problems:/data/problems
