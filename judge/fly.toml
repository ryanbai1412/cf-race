app = "cf-race-judge"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PROBLEMS_DIR = "/data/problems"
  CACHE_DIR = "/data/cache"
  JUDGE_SANDBOX = "isolate"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

# Single machine on purpose: the compile cache is per-machine, and Fly's proxy
# balances by load rather than pinning a client, so a second machine would make
# a submit re-pay the ~650ms cold compile whenever it landed on the other one.
[[vm]]
  size = "performance-16x"
