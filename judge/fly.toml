app = "cf-race-judge"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PROBLEMS_DIR = "/data/problems"
  CACHE_DIR = "/data/cache"
  JUDGE_SANDBOX = "isolate"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # Keep every request on one machine: the compile cache is per-machine, so
  # spilling a submit onto the other one re-pays the ~650ms cold compile. The
  # soft limit sits far above peak booth concurrency, leaving the second
  # machine idle until the first is overloaded or fails its health check.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "performance-16x"
