# pnpm workspace: web app (root) + judge service + shared packages.
packages:
  - judge
  - packages/*

# Only resolve package versions published at least 7 days ago
# (matches the org package proxy's supply-chain age policy).
minimumReleaseAge: 10080

# Judge test tooling: pin rollup (vitest transitive dep).
overrides:
  rollup: 4.62.2
